<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12301e">
<title>Admin – Green Plants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --forest:#12301e;
    --fern:#2f6b3c;
    --mist:#eef2ea;
    --chalk:#fbfcfa;
    --line:#d9e1d3;
    --blossom:#c8506f;
    --text:#1c2a20;
    --muted:#5e6d62;
    --font-display:'Bricolage Grotesque','Segoe UI',Arial,sans-serif;
    --font-body:'Figtree','Segoe UI',Arial,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:var(--font-body); background:var(--mist); color:var(--text); line-height:1.5; }
h1,h2{ font-family:var(--font-display); color:var(--forest); letter-spacing:-0.02em; }

.top{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;
    padding:14px clamp(16px,4vw,48px);
    background:rgba(251,252,250,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
}
.top h1{ font-size:22px; }
.actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

.btn{
    font-family:inherit; font-size:15px; font-weight:600;
    padding:10px 18px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--chalk); color:var(--text);
    cursor:pointer; text-decoration:none; display:inline-block;
    transition:background .2s, border-color .2s;
}
.btn:hover{ border-color:var(--fern); }
.btn:disabled{ opacity:.6; cursor:wait; }
.btn.primary{ background:var(--forest); border-color:var(--forest); color:white; }
.btn.primary:hover{ background:var(--fern); }
.btn.primary.dirty{ background:var(--blossom); border-color:var(--blossom); }
.btn.small{ padding:8px 14px; font-size:14px; }

main{ max-width:1100px; margin:0 auto; padding:28px clamp(16px,4vw,48px) 80px; }

.card{ background:var(--chalk); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:36px; }
.card h2{ font-size:24px; margin-bottom:16px; }

label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
input[type=text], input[type=password], select{
    width:100%; font-family:inherit; font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--line); border-radius:10px;
    background:white; color:var(--text);
}
input:focus-visible, select:focus-visible, .btn:focus-visible, .icon:focus-visible{
    outline:3px solid var(--blossom); outline-offset:2px;
}

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; align-items:end; }
.photo-field{ grid-column:span 2; }
.photo-row{ display:flex; gap:10px; align-items:center; }
.hidden-file{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
.photo-row label.btn{ margin:0; color:var(--text); font-size:15px; white-space:nowrap; }
.preview{ width:46px; height:46px; flex-shrink:0; border-radius:10px; object-fit:cover; background:var(--line); }
.hint{ font-size:13px; color:var(--muted); margin-top:14px; }

.listhead{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
.listhead h2{ font-size:24px; }
.listhead input{ max-width:260px; border-radius:999px; padding:10px 16px; }

.row{
    display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center;
    background:var(--chalk); border:1px solid var(--line); border-radius:16px;
    padding:12px; margin-bottom:10px;
}
.row.sold{ background:#f1f1ef; }
.thumb{ width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--line); }
.fields{ display:grid; grid-template-columns:2fr 1.2fr 1.6fr 1.2fr 1fr; gap:8px; }
.btns{ display:flex; gap:6px; }
.icon{
    width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); border-radius:10px;
    background:white; color:var(--text);
    font-size:17px; cursor:pointer; margin:0;
    transition:background .2s, border-color .2s;
}
.icon:hover{ border-color:var(--fern); background:var(--mist); }
.icon.del:hover{ border-color:var(--blossom); color:var(--blossom); }
.icon:disabled{ opacity:.35; cursor:default; }
.empty{ text-align:center; color:var(--muted); padding:40px 0; }

#toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    max-width:90vw; text-align:center;
    background:var(--forest); color:white;
    padding:12px 22px; border-radius:18px; font-weight:500;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:200;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

dialog{
    margin:auto; border:none; border-radius:18px;
    padding:26px; width:min(480px, 92vw);
    background:var(--chalk); color:var(--text);
    box-shadow:0 30px 80px rgba(18,48,30,.35);
}
dialog::backdrop{ background:rgba(8,20,12,.6); }
dialog h2{ font-size:22px; margin-bottom:6px; }
dialog p{ font-size:14px; color:var(--muted); margin-bottom:14px; }
dialog .field{ margin-bottom:12px; }
dialog .btns2{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:18px; }

@media (max-width:820px){
    .photo-field{ grid-column:auto; }
    .row{ grid-template-columns:56px 1fr; }
    .thumb{ width:56px; height:56px; }
    .fields{ grid-template-columns:1fr 1fr; grid-column:1 / -1; }
    .fields input:first-child{ grid-column:1 / -1; }
    .btns{ grid-column:1 / -1; justify-content:flex-end; }
}

/* ===== TELEFON ===== */
@media (max-width:820px){
    .top{ backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--chalk); }
    .top .actions .btn.small:not(#settingsBtn){ display:none; }
    input[type=text], input[type=password], select{ font-size:16px; padding:12px; }
    .icon{ width:44px; height:44px; }
    .btns{ gap:8px; }
    main{ padding-bottom:120px; }
    #publishBtn{
        position:fixed; left:16px; right:16px; bottom:16px; z-index:60;
        padding:17px; font-size:17px; text-align:center;
        box-shadow:0 12px 30px rgba(18,48,30,.35);
    }
    #toast{ bottom:96px; }
}
</style>
</head>
<body>

<header class="top">
    <h1>Administrare stoc</h1>
    <div class="actions">
        <a class="btn small" href="index.html" target="_blank">Vezi site-ul</a>
        <button class="btn small" id="settingsBtn" type="button">Setări</button>
        <button class="btn small" id="saveBtn" type="button">Salvează fișier</button>
        <button class="btn primary" id="publishBtn" type="button">Publică pe site</button>
    </div>
</header>

<main>

    <!-- ADAUGĂ -->
    <section class="card">
        <h2>Adaugă o plantă</h2>

        <form id="addForm" autocomplete="off">
            <div class="form-grid">
                <div>
                    <label for="aName">Nume</label>
                    <input type="text" id="aName" placeholder="ex: Ginkgo" required>
                </div>
                <div>
                    <label for="aPrice">Preț</label>
                    <input type="text" id="aPrice" placeholder="ex: 200-400 lei" required>
                </div>
                <div>
                    <label for="aCat">Categorie</label>
                    <select id="aCat">
                        <option value="ornamentale">Ornamentale</option>
                        <option value="conifere">Conifere</option>
                        <option value="pomi">Pomi fructiferi</option>
                        <option value="fructe">Fructe de pădure</option>
                    </select>
                </div>
                <div>
                    <label for="aTag">Etichetă</label>
                    <select id="aTag">
                        <option value="nou">Nou</option>
                        <option value="">Fără etichetă</option>
                        <option value="epuizat">Stoc epuizat</option>
                    </select>
                </div>
                <div class="photo-field">
                    <label for="aPhoto">Poza</label>
                    <div class="photo-row">
                        <img class="preview" id="aPreview" alt="">
                        <input type="text" id="aPhoto" placeholder="alege din calculator →" required>
                        <input type="file" id="aFile" accept="image/*" class="hidden-file">
                        <label class="btn" for="aFile">Alege poza</label>
                    </div>
                </div>
                <div>
                    <button class="btn primary" type="submit" style="width:100%">Adaugă în listă</button>
                </div>
            </div>
            <p class="hint">Planta nouă apare prima în listă. Când apeși „Publică pe site", poza se urcă singură și se micșorează automat dacă e prea mare.</p>
        </form>
    </section>

    <!-- LISTA -->
    <section>
        <div class="listhead">
            <h2>Plante în stoc (<span id="count">0</span>)</h2>
            <input type="text" id="q" placeholder="Caută în listă..." aria-label="Caută în listă">
        </div>
        <div id="list"></div>
    </section>

</main>

<!-- SETĂRI PUBLICARE -->
<dialog id="dlg">
    <h2>Setări publicare</h2>
    <p>Se completează o singură dată. Cheia rămâne doar în acest browser, nu pe site.</p>

    <div class="field">
        <label for="sToken">Cheie GitHub (token)</label>
        <input type="password" id="sToken" placeholder="github_pat_..." autocomplete="off">
    </div>
    <div class="field">
        <label for="sRepo">Repo (utilizator/nume)</label>
        <input type="text" id="sRepo" placeholder="plantemd/greenplantsmd">
    </div>
    <div class="field">
        <label for="sBranch">Branch</label>
        <input type="text" id="sBranch" placeholder="main">
    </div>

    <div class="btns2">
        <button class="btn small" type="button" id="sClear">Șterge cheia</button>
        <button class="btn small" type="button" id="sCancel">Anulează</button>
        <button class="btn small primary" type="button" id="sSave">Salvează</button>
    </div>
</dialog>

<div id="toast" role="status"></div>

<!-- fără cache, ca să vezi mereu lista actuală -->
<script>document.write('<script src="plante.js?v=' + Date.now() + '"><\/script>');</script>
<script>
// ===== SETĂRI (se țin doar în acest browser) =====
const CFG_KEY = 'gp_admin_cfg';
const DEFAULT_CFG = { token: '', repo: 'plantemd/greenplantsmd', branch: 'main' };

function loadCfg() {
    try { return Object.assign({}, DEFAULT_CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }
    catch { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch {}
}
let cfg = loadCfg();

// ===== STARE =====
const CATS = {
    ornamentale: 'Ornamentale',
    conifere: 'Conifere',
    pomi: 'Pomi fructiferi',
    fructe: 'Fructe de pădure'
};

const toItems = (arr) => arr.map(([name, price, photo, cat, tag]) => ({ name, price, photo, cat, tag: tag || '' }));

let items = toItems(typeof PLANTE !== 'undefined' ? PLANTE : []);
let dirty = false;
let fileHandle = null;
const pending = {};   // poze alese și încă neurcate: nume -> { file, url }

const $ = (id) => document.getElementById(id);
const listEl = $('list');
const saveBtn = $('saveBtn');
const publishBtn = $('publishBtn');

const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function setDirty(v) {
    dirty = v;
    publishBtn.classList.toggle('dirty', v);
    publishBtn.textContent = v ? 'Publică pe site •' : 'Publică pe site';
}

function toast(msg, sticky) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    if (!sticky) toast.timer = setTimeout(() => t.classList.remove('show'), 4200);
}

const thumbSrc = (photo) => (pending[photo] ? pending[photo].url : photo);

// Poza din galeria telefonului poate avea mereu același nume (image.jpg).
// Îi dăm un nume unic, ca să nu suprascrie o poză existentă.
function uniqueName(file) {
    const ext = /\.png$/i.test(file.name) ? 'png' : 'jpg';
    return 'poza-' + Date.now().toString(36) + '.' + ext;
}

// ===== AFIȘARE LISTĂ =====
function render() {
    const q = $('q').value.trim().toLowerCase();
    const filtering = q !== '';
    $('count').textContent = items.length;

    const rows = items.map((p, i) => ({ p, i }))
        .filter(({ p }) => !filtering || p.name.toLowerCase().includes(q));

    if (!rows.length) {
        listEl.innerHTML = '<p class="empty">Nu există nicio plantă.</p>';
        return;
    }

    listEl.innerHTML = rows.map(({ p, i }) => `
        <div class="row${p.tag === 'epuizat' ? ' sold' : ''}" data-i="${i}">
            <img class="thumb" src="${esc(thumbSrc(p.photo))}" alt="" onerror="this.style.opacity=.3">
            <div class="fields">
                <input type="text" data-f="name" value="${esc(p.name)}" aria-label="Nume">
                <input type="text" data-f="price" value="${esc(p.price)}" aria-label="Preț">
                <input type="text" data-f="photo" value="${esc(p.photo)}" aria-label="Poza">
                <select data-f="cat" aria-label="Categorie">
                    ${Object.entries(CATS).map(([k, v]) =>
                        `<option value="${k}"${p.cat === k ? ' selected' : ''}>${v}</option>`).join('')}
                </select>
                <select data-f="tag" aria-label="Etichetă">
                    <option value=""${p.tag === '' ? ' selected' : ''}>În stoc</option>
                    <option value="nou"${p.tag === 'nou' ? ' selected' : ''}>Nou</option>
                    <option value="epuizat"${p.tag === 'epuizat' ? ' selected' : ''}>Epuizat</option>
                </select>
            </div>
            <div class="btns">
                <label class="icon" title="Schimbă poza">📷<input type="file" accept="image/*" data-pick class="hidden-file"></label>
                <button class="icon" data-act="up" title="Mută sus" aria-label="Mută sus"${filtering || i === 0 ? ' disabled' : ''}>↑</button>
                <button class="icon" data-act="down" title="Mută jos" aria-label="Mută jos"${filtering || i === items.length - 1 ? ' disabled' : ''}>↓</button>
                <button class="icon del" data-act="del" title="Șterge" aria-label="Șterge">🗑</button>
            </div>
        </div>
    `).join('');
}

// ===== EDITARE ÎN LISTĂ =====
listEl.addEventListener('input', (e) => {
    const row = e.target.closest('.row');
    if (!row || !e.target.dataset.f) return;
    items[row.dataset.i][e.target.dataset.f] = e.target.value;
    if (e.target.dataset.f === 'photo') row.querySelector('.thumb').src = thumbSrc(e.target.value);
    if (e.target.dataset.f === 'tag') row.classList.toggle('sold', e.target.value === 'epuizat');
    setDirty(true);
});

listEl.addEventListener('change', (e) => {
    if (!e.target.matches('[data-pick]')) return;
    const file = e.target.files[0];
    const row = e.target.closest('.row');
    if (!file) return;
    const nm = uniqueName(file);
    pending[nm] = { file, url: URL.createObjectURL(file) };
    items[row.dataset.i].photo = nm;
    setDirty(true);
    render();
    toast('Poza se urcă la „Publică pe site".');
});

listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const i = Number(btn.closest('.row').dataset.i);

    if (btn.dataset.act === 'del') {
        if (!confirm('Ștergi „' + items[i].name + '"?')) return;
        items.splice(i, 1);
    } else {
        const j = btn.dataset.act === 'up' ? i - 1 : i + 1;
        [items[i], items[j]] = [items[j], items[i]];
    }
    setDirty(true);
    render();
});

$('q').addEventListener('input', render);

// ===== ADAUGĂ PLANTĂ =====
$('aFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const nm = uniqueName(file);
    pending[nm] = { file, url: URL.createObjectURL(file) };
    $('aPhoto').value = nm;
    $('aPreview').src = pending[nm].url;
});

$('aPhoto').addEventListener('input', (e) => { $('aPreview').src = thumbSrc(e.target.value); });

$('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    items.unshift({
        name: $('aName').value.trim(),
        price: $('aPrice').value.trim(),
        photo: $('aPhoto').value.trim(),
        cat: $('aCat').value,
        tag: $('aTag').value
    });
    $('addForm').reset();
    $('aPreview').removeAttribute('src');
    setDirty(true);
    render();
    toast('Planta a fost adăugată. Apasă „Publică pe site" ca să apară.');
});

// ===== GENERARE plante.js =====
function buildFile() {
    const head = [
        '// =====================================================',
        '//  LISTA DE PLANTE – generat din admin.html',
        '//',
        '//  Format: ["Nume", "Preț", "poza.png", "categorie", "etichetă (opțional)"],',
        '//  Categorii: ornamentale | conifere | pomi | fructe',
        '//  Etichete: nou | epuizat',
        '//  Planta de sus apare prima pe site.',
        '// ====================================================='
    ].join('\n');

    const rows = items.map(p => {
        const arr = [p.name, p.price, p.photo, p.cat];
        if (p.tag) arr.push(p.tag);
        return '    [' + arr.map(x => JSON.stringify(x)).join(', ') + '],';
    }).join('\n');

    return head + '\n\nconst PLANTE = [\n' + rows + '\n];\n';
}

// ===== PUBLICARE PE GITHUB =====
const b64text = (text) => btoa(unescape(encodeURIComponent(text)));

function gh(path, opts = {}) {
    const isPut = opts.method === 'PUT';
    const url = 'https://api.github.com/repos/' + cfg.repo + '/contents/' +
        path.split('/').map(encodeURIComponent).join('/') +
        (isPut ? '' : '?ref=' + encodeURIComponent(cfg.branch));
    return fetch(url, Object.assign({}, opts, {
        headers: Object.assign({
            Authorization: 'Bearer ' + cfg.token,
            Accept: 'application/vnd.github+json'
        }, opts.headers || {})
    }));
}

async function getSha(path) {
    const res = await gh(path);
    if (res.status === 404) return null;
    if (!res.ok) throw { status: res.status };
    return (await res.json()).sha;
}

async function putFile(path, contentB64, message) {
    const sha = await getSha(path);
    const body = { message, content: contentB64, branch: cfg.branch };
    if (sha) body.sha = sha;
    const res = await gh(path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!res.ok) throw { status: res.status };
}

function blobToB64(blob) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(blob);
    });
}

// Micșorează pozele mari (max 1200px) ca site-ul să rămână rapid
function imageToB64(file, name) {
    const ext = name.split('.').pop().toLowerCase();
    const type = ext === 'png' ? 'image/png' : (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : null;
    if (!type) return blobToB64(file);

    return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
            if (scale === 1 && file.size < 600000) { URL.revokeObjectURL(url); return resolve(blobToB64(file)); }
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            c.toBlob((b) => { URL.revokeObjectURL(url); resolve(blobToB64(b || file)); }, type, 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(blobToB64(file)); };
        img.src = url;
    });
}

function explain(err) {
    if (err && err.status === 401) return 'Cheia GitHub e greșită sau a expirat. Fă una nouă în Setări.';
    if (err && err.status === 403) return 'Cheia nu are voie să scrie. La permisiuni pune „Contents: Read and write".';
    if (err && err.status === 404) return 'Nu găsesc repo-ul. Verifică „Repo" și permisiunile cheii în Setări.';
    if (err && err.status === 409) return 'Conflict. Mai încearcă o dată peste câteva secunde.';
    if (err && err.status === 422) return 'GitHub a refuzat fișierul. Verifică numele pozei.';
    return 'Nu s-a putut publica. Verifică internetul și încearcă din nou.';
}

async function publish() {
    if (!cfg.token) { openSettings(); toast('Mai întâi pune cheia GitHub în Setări.'); return; }
    publishBtn.disabled = true;

    try {
        const used = items.map(p => p.photo);
        const names = Object.keys(pending).filter(n => used.includes(n));

        for (let k = 0; k < names.length; k++) {
            toast('Urc poza ' + (k + 1) + ' din ' + names.length + '...', true);
            await putFile(names[k], await imageToB64(pending[names[k]].file, names[k]), 'Add photo ' + names[k]);
            delete pending[names[k]];
        }

        toast('Urc lista de plante...', true);
        await putFile('plante.js', b64text(buildFile()), 'Update plante.js via admin');

        setDirty(false);
        toast('Publicat! Pe site apare în 1-2 minute (apoi Ctrl+F5).');
    } catch (err) {
        toast(explain(err));
    } finally {
        publishBtn.disabled = false;
    }
}

publishBtn.addEventListener('click', publish);

// Ia lista cea mai nouă direct de pe GitHub, ca să nu lucrezi pe una veche
async function loadFromGitHub() {
    if (!cfg.token) return;
    try {
        const res = await gh('plante.js', { headers: { Accept: 'application/vnd.github.raw+json' } });
        if (!res.ok) return;
        const text = await res.text();
        const arr = new Function(text + '\nreturn PLANTE;')();
        if (Array.isArray(arr) && arr.length) {
            items = toItems(arr);
            render();
        }
    } catch {}
}

// ===== SETĂRI =====
const dlg = $('dlg');

function openSettings() {
    $('sToken').value = cfg.token;
    $('sRepo').value = cfg.repo;
    $('sBranch').value = cfg.branch;
    dlg.showModal();
}

$('settingsBtn').addEventListener('click', openSettings);
$('sCancel').addEventListener('click', () => dlg.close());
$('sSave').addEventListener('click', () => {
    cfg.token = $('sToken').value.trim();
    cfg.repo = $('sRepo').value.trim() || DEFAULT_CFG.repo;
    cfg.branch = $('sBranch').value.trim() || DEFAULT_CFG.branch;
    saveCfg();
    dlg.close();
    toast('Setări salvate.');
    loadFromGitHub();
});
$('sClear').addEventListener('click', () => {
    cfg.token = '';
    saveCfg();
    $('sToken').value = '';
    toast('Cheia a fost ștearsă din acest browser.');
});

// ===== SALVEAZĂ CA FIȘIER (variantă de rezervă) =====
function download(text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'plante.js';
    a.click();
    URL.revokeObjectURL(url);
    toast('plante.js descărcat.');
}

saveBtn.addEventListener('click', async () => {
    const text = buildFile();
    if (window.showSaveFilePicker) {
        try {
            if (!fileHandle) {
                fileHandle = await window.showSaveFilePicker({
                    suggestedName: 'plante.js',
                    types: [{ description: 'JavaScript', accept: { 'text/javascript': ['.js'] } }]
                });
            }
            const w = await fileHandle.createWritable();
            await w.write(text);
            await w.close();
            toast('Fișier salvat.');
            return;
        } catch (err) {
            if (err.name === 'AbortError') return;
            fileHandle = null;
        }
    }
    download(text);
});

window.addEventListener('beforeunload', (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
loadFromGitHub();
</script>
</body>
</html>
