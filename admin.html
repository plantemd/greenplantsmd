<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Green Plants</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --forest:#12301e;
    --fern:#2f6b3c;
    --mist:#eef2ea;
    --chalk:#fbfcfa;
    --line:#d9e1d3;
    --blossom:#c8506f;
    --text:#1c2a20;
    --muted:#5e6d62;
    --font-display:'Bricolage Grotesque','Segoe UI',Arial,sans-serif;
    --font-body:'Figtree','Segoe UI',Arial,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
    font-family:var(--font-body);
    background:var(--mist);
    color:var(--text);
    line-height:1.5;
}
h1,h2{ font-family:var(--font-display); color:var(--forest); letter-spacing:-0.02em; }

/* Bara de sus */
.top{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;
    padding:14px clamp(16px,4vw,48px);
    background:rgba(251,252,250,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
}
.top h1{ font-size:22px; }
.actions{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

.btn{
    font-family:inherit; font-size:15px; font-weight:600;
    padding:10px 18px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--chalk); color:var(--text);
    cursor:pointer; text-decoration:none; display:inline-block;
    transition:background .2s, border-color .2s;
}
.btn:hover{ border-color:var(--fern); }
.btn.primary{ background:var(--forest); border-color:var(--forest); color:white; }
.btn.primary:hover{ background:var(--fern); }
.btn.primary.dirty{ background:var(--blossom); border-color:var(--blossom); }

main{
    max-width:1100px; margin:0 auto;
    padding:28px clamp(16px,4vw,48px) 80px;
}

.card{
    background:var(--chalk);
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    margin-bottom:36px;
}
.card h2{ font-size:24px; margin-bottom:16px; }

label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
input[type=text], select{
    width:100%;
    font-family:inherit; font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--line); border-radius:10px;
    background:white; color:var(--text);
}
input:focus-visible, select:focus-visible, .btn:focus-visible, .icon:focus-visible{
    outline:3px solid var(--blossom); outline-offset:2px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:14px;
    align-items:end;
}
.photo-field{ grid-column:span 2; }
.photo-row{ display:flex; gap:10px; align-items:center; }
.photo-row input[type=file]{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
.photo-row label.btn{ margin:0; color:var(--text); font-size:15px; white-space:nowrap; }
.preview{
    width:46px; height:46px; flex-shrink:0;
    border-radius:10px; object-fit:cover; background:var(--line);
}
.hint{ font-size:13px; color:var(--muted); margin-top:14px; }

.listhead{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;
    margin-bottom:16px;
}
.listhead h2{ font-size:24px; }
.listhead input{ max-width:260px; border-radius:999px; padding:10px 16px; }

/* Rânduri de plante */
.row{
    display:grid;
    grid-template-columns:64px 1fr auto;
    gap:14px;
    align-items:center;
    background:var(--chalk);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    margin-bottom:10px;
}
.row.sold{ background:#f1f1ef; }
.thumb{
    width:64px; height:64px; border-radius:12px;
    object-fit:cover; background:var(--line);
}
.fields{
    display:grid;
    grid-template-columns:2fr 1.2fr 1.6fr 1.2fr 1fr;
    gap:8px;
}
.btns{ display:flex; gap:6px; }
.icon{
    width:38px; height:38px;
    border:1.5px solid var(--line); border-radius:10px;
    background:white; color:var(--text);
    font-size:17px; cursor:pointer;
    transition:background .2s, border-color .2s;
}
.icon:hover{ border-color:var(--fern); background:var(--mist); }
.icon.del:hover{ border-color:var(--blossom); color:var(--blossom); }
.icon:disabled{ opacity:.35; cursor:default; }

.empty{ text-align:center; color:var(--muted); padding:40px 0; }

#toast{
    position:fixed; left:50%; bottom:24px;
    transform:translate(-50%, 20px);
    background:var(--forest); color:white;
    padding:12px 22px; border-radius:999px;
    font-weight:500;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:100;
}
#toast.show{ opacity:1; transform:translate(-50%, 0); }

@media (max-width:820px){
    .photo-field{ grid-column:auto; }
    .row{ grid-template-columns:56px 1fr; }
    .thumb{ width:56px; height:56px; }
    .fields{ grid-template-columns:1fr 1fr; grid-column:1 / -1; }
    .fields input:first-child{ grid-column:1 / -1; }
    .btns{ grid-column:1 / -1; justify-content:flex-end; }
    .row > .thumb{ grid-row:1; }
}
</style>
</head>
<body>

<header class="top">
    <h1>Administrare stoc</h1>
    <div class="actions">
        <a class="btn" href="index.html" target="_blank">Vezi site-ul</a>
        <button class="btn" id="copyBtn" type="button">Copiază codul</button>
        <button class="btn primary" id="saveBtn" type="button">Salvează plante.js</button>
    </div>
</header>

<main>

    <!-- ADAUGĂ -->
    <section class="card">
        <h2>Adaugă o plantă</h2>

        <form id="addForm" autocomplete="off">
            <div class="form-grid">
                <div>
                    <label for="aName">Nume</label>
                    <input type="text" id="aName" placeholder="ex: Ginkgo" required>
                </div>
                <div>
                    <label for="aPrice">Preț</label>
                    <input type="text" id="aPrice" placeholder="ex: 200-400 lei" required>
                </div>
                <div>
                    <label for="aCat">Categorie</label>
                    <select id="aCat">
                        <option value="ornamentale">Ornamentale</option>
                        <option value="conifere">Conifere</option>
                        <option value="pomi">Pomi fructiferi</option>
                        <option value="fructe">Fructe de pădure</option>
                    </select>
                </div>
                <div>
                    <label for="aTag">Etichetă</label>
                    <select id="aTag">
                        <option value="nou">Nou</option>
                        <option value="">Fără etichetă</option>
                        <option value="epuizat">Stoc epuizat</option>
                    </select>
                </div>
                <div class="photo-field">
                    <label for="aPhoto">Poza (numele fișierului)</label>
                    <div class="photo-row">
                        <img class="preview" id="aPreview" alt="">
                        <input type="text" id="aPhoto" placeholder="ex: ginkgo.png" required>
                        <input type="file" id="aFile" accept="image/*">
                        <label class="btn" for="aFile" tabindex="0" id="pickBtn">Alege poza</label>
                    </div>
                </div>
                <div>
                    <button class="btn primary" type="submit" style="width:100%">Adaugă în listă</button>
                </div>
            </div>
            <p class="hint">Planta nouă apare prima în listă. Poza trebuie pusă și în folderul site-ului, lângă <b>index.html</b>.</p>
        </form>
    </section>

    <!-- LISTA -->
    <section>
        <div class="listhead">
            <h2>Plante în stoc (<span id="count">0</span>)</h2>
            <input type="text" id="q" placeholder="Caută în listă..." aria-label="Caută în listă">
        </div>
        <div id="list"></div>
    </section>

</main>

<div id="toast" role="status"></div>

<script src="plante.js"></script>
<script>
// ===== STARE =====
const CATS = {
    ornamentale: 'Ornamentale',
    conifere: 'Conifere',
    pomi: 'Pomi fructiferi',
    fructe: 'Fructe de pădure'
};

let items = PLANTE.map(([name, price, photo, cat, tag]) => ({
    name, price, photo, cat, tag: tag || ''
}));

let dirty = false;
let fileHandle = null;

const $ = (id) => document.getElementById(id);
const listEl = $('list');
const saveBtn = $('saveBtn');

function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

function setDirty(v) {
    dirty = v;
    saveBtn.classList.toggle('dirty', v);
    saveBtn.textContent = v ? 'Salvează plante.js •' : 'Salvează plante.js';
}

function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ===== AFIȘARE LISTĂ =====
function render() {
    const q = $('q').value.trim().toLowerCase();
    const filtering = q !== '';
    $('count').textContent = items.length;

    const rows = items.map((p, i) => ({ p, i }))
        .filter(({ p }) => !filtering || p.name.toLowerCase().includes(q));

    if (!rows.length) {
        listEl.innerHTML = '<p class="empty">Nu există nicio plantă.</p>';
        return;
    }

    listEl.innerHTML = rows.map(({ p, i }) => `
        <div class="row${p.tag === 'epuizat' ? ' sold' : ''}" data-i="${i}">
            <img class="thumb" src="${esc(p.photo)}" alt="" onerror="this.style.opacity=.3">
            <div class="fields">
                <input type="text" data-f="name" value="${esc(p.name)}" aria-label="Nume">
                <input type="text" data-f="price" value="${esc(p.price)}" aria-label="Preț">
                <input type="text" data-f="photo" value="${esc(p.photo)}" aria-label="Poza">
                <select data-f="cat" aria-label="Categorie">
                    ${Object.entries(CATS).map(([k, v]) =>
                        `<option value="${k}"${p.cat === k ? ' selected' : ''}>${v}</option>`).join('')}
                </select>
                <select data-f="tag" aria-label="Etichetă">
                    <option value=""${p.tag === '' ? ' selected' : ''}>În stoc</option>
                    <option value="nou"${p.tag === 'nou' ? ' selected' : ''}>Nou</option>
                    <option value="epuizat"${p.tag === 'epuizat' ? ' selected' : ''}>Epuizat</option>
                </select>
            </div>
            <div class="btns">
                <button class="icon" data-act="up" title="Mută sus" aria-label="Mută sus"${filtering || i === 0 ? ' disabled' : ''}>↑</button>
                <button class="icon" data-act="down" title="Mută jos" aria-label="Mută jos"${filtering || i === items.length - 1 ? ' disabled' : ''}>↓</button>
                <button class="icon del" data-act="del" title="Șterge" aria-label="Șterge">🗑</button>
            </div>
        </div>
    `).join('');
}

// ===== EDITARE ÎN LISTĂ =====
listEl.addEventListener('input', (e) => {
    const row = e.target.closest('.row');
    if (!row || !e.target.dataset.f) return;
    const item = items[row.dataset.i];
    item[e.target.dataset.f] = e.target.value;
    if (e.target.dataset.f === 'photo') row.querySelector('.thumb').src = e.target.value;
    if (e.target.dataset.f === 'tag') row.classList.toggle('sold', e.target.value === 'epuizat');
    setDirty(true);
});

listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const i = Number(btn.closest('.row').dataset.i);

    if (btn.dataset.act === 'del') {
        if (!confirm('Ștergi „' + items[i].name + '"?')) return;
        items.splice(i, 1);
    } else {
        const j = btn.dataset.act === 'up' ? i - 1 : i + 1;
        [items[i], items[j]] = [items[j], items[i]];
    }
    setDirty(true);
    render();
});

$('q').addEventListener('input', render);

// ===== ADAUGĂ PLANTĂ =====
$('pickBtn').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('aFile').click(); } });

$('aFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    $('aPhoto').value = file.name;
    $('aPreview').src = URL.createObjectURL(file);
    toast('Am completat numele pozei. Urc-o și pe GitHub, lângă index.html.');
});

$('aPhoto').addEventListener('input', (e) => { $('aPreview').src = e.target.value; });

$('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    items.unshift({
        name: $('aName').value.trim(),
        price: $('aPrice').value.trim(),
        photo: $('aPhoto').value.trim(),
        cat: $('aCat').value,
        tag: $('aTag').value
    });
    $('addForm').reset();
    $('aPreview').removeAttribute('src');
    setDirty(true);
    render();
    toast('Planta a fost adăugată. Nu uita să salvezi.');
});

// ===== GENERARE plante.js =====
function buildFile() {
    const head = [
        '// =====================================================',
        '//  LISTA DE PLANTE – generat din admin.html',
        '//',
        '//  Format: ["Nume", "Preț", "poza.png", "categorie", "etichetă (opțional)"],',
        '//  Categorii: ornamentale | conifere | pomi | fructe',
        '//  Etichete: nou | epuizat',
        '//  Planta de sus apare prima pe site.',
        '// ====================================================='
    ].join('\n');

    const rows = items.map(p => {
        const arr = [p.name, p.price, p.photo, p.cat];
        if (p.tag) arr.push(p.tag);
        return '    [' + arr.map(x => JSON.stringify(x)).join(', ') + '],';
    }).join('\n');

    return head + '\n\nconst PLANTE = [\n' + rows + '\n];\n';
}

function download(text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'plante.js';
    a.click();
    URL.revokeObjectURL(url);
    setDirty(false);
    toast('plante.js descărcat. Înlocuiește fișierul vechi din folderul site-ului.');
}

async function save() {
    const text = buildFile();

    // Chrome / Edge pe calculator: scrie direct în fișier
    if (window.showSaveFilePicker) {
        try {
            if (!fileHandle) {
                fileHandle = await window.showSaveFilePicker({
                    suggestedName: 'plante.js',
                    types: [{ description: 'JavaScript', accept: { 'text/javascript': ['.js'] } }]
                });
            }
            const w = await fileHandle.createWritable();
            await w.write(text);
            await w.close();
            setDirty(false);
            toast('Salvat! Reîncarcă site-ul ca să vezi schimbările.');
            return;
        } catch (err) {
            if (err.name === 'AbortError') return;
            fileHandle = null;
        }
    }
    download(text);
}

saveBtn.addEventListener('click', save);

$('copyBtn').addEventListener('click', async () => {
    try {
        await navigator.clipboard.writeText(buildFile());
        toast('Cod copiat. Lipește-l în plante.js.');
    } catch {
        const ta = document.createElement('textarea');
        ta.value = buildFile();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('Cod copiat. Lipește-l în plante.js.');
    }
});

window.addEventListener('beforeunload', (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
</script>
</body>
</html>
